name: Upload data to S3

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '.github/workflows/upload-s3.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upload-s3
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.DATAHUB_UPDATE_AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.DATAHUB_UPDATE_AWS_REGION }}
      S3_BUCKET: ${{ vars.DATAHUB_UPDATE_S3_BUCKET }}
      S3_PREFIX: ${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/epoch-gh-actions-datahub-${{ github.event.repository.name }}
          aws-region: ${{ env.AWS_REGION }}

      # sync --delete mirrors data/ into the prefix, so files removed from the
      # repo are removed from S3 too (cp --recursive left them behind).
      - name: Upload data files
        shell: bash
        run: aws s3 sync data/ "s3://$S3_BUCKET/$S3_PREFIX/" --delete
