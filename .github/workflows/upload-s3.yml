name: Upload data to S3

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '.github/workflows/upload-s3.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upload-s3
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.DATAHUB_UPDATE_AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.DATAHUB_UPDATE_AWS_REGION }}
      S3_BUCKET: ${{ vars.DATAHUB_UPDATE_S3_BUCKET }}
      S3_PREFIX: ${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/epoch-gh-actions-datahub-${{ github.event.repository.name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload data files
        shell: bash
        run: |
          set -euo pipefail

          upload() {
            local file="$1"
            local key="$S3_PREFIX/$(basename "$file")"
            local content_type
            case "$file" in
              *.csv.gz) content_type='application/gzip' ;;
              *.csv)    content_type='text/csv' ;;
              *.json)   content_type='application/json' ;;
              *)        content_type='application/octet-stream' ;;
            esac
            aws s3api put-object \
              --bucket "$S3_BUCKET" \
              --key "$key" \
              --body "$file" \
              --content-type "$content_type" > /dev/null
            printf -- '- `s3://%s/%s` (%s bytes)\n' "$S3_BUCKET" "$key" "$(stat -c %s "$file")" >> "$GITHUB_STEP_SUMMARY"
          }

          echo '## Uploaded to S3' >> "$GITHUB_STEP_SUMMARY"
          for file in data/*; do
            upload "$file"
          done
